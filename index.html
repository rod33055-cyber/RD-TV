<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#081629">
<title>RD'TV</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#081629;
color:white;
font-family:Arial,sans-serif;
}
header{
padding:24px 18px;
background:#102644;
border-bottom:1px solid #24456b;
}
.logo{font-size:30px;font-weight:bold;color:#55aaff}
.subtitle{color:#a9c7e8;margin-top:7px}
nav{
display:flex;justify-content:space-around;
padding:16px 5px;background:#102644;
}
nav span{color:#b9d5f3}
main{padding:20px}
h2{font-size:21px}
.card{
background:#142b48;
border:1px solid #254b73;
border-radius:16px;
padding:18px;
margin:14px 0;
}
.live{color:#50b5ff;font-weight:bold}
footer{text-align:center;color:#7897ba;padding:30px}
</style>
</head>
<body>
<header>
<div class="logo">RD'TV</div>
<div class="subtitle">عالم الرياضة والقنوات المباشرة</div>
</header>
<nav>
<span>الرئيسية</span>
<span>المباريات</span>
<span>القنوات</span>
<span>المفضلة</span>
</nav>
<main>
<h2>أهلاً بك في RD'TV ⚽</h2>
<div class="card">
<div class="live">● LIVE</div>
<h3>المباريات المباشرة</h3>
<p>تابع مبارياتك المفضلة من مكان واحد.</p>
</div>
<div class="card">
<h3>📺 القنوات التلفزيونية</h3>
<p>قريباً ستجد قنواتك المفضلة هنا.</p>
</div>
<div class="card">
<h3>⭐ المفضلة</h3>
<p>احتفظ بقنواتك ومبارياتك المفضلة.</p>
</div>
</main>
<footer>RD'TV © 2026</footer>
</body>
</html>
